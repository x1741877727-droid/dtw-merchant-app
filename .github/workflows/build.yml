name: build-merchant-app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm install

      - name: Generate app icons
        run: npx tauri icon app-icon.png

      - name: Build (Tauri NSIS installer + signed updater artifact)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtw-merchant-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Publish update to duitaofang.cn
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -e
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BUNDLE=src-tauri/target/release/bundle/nsis
          EXE=$(ls $BUNDLE/*-setup.exe | head -1)
          SIG=$(cat "$EXE.sig" | tr -d '\n')
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # 中文产品名 → URL 编码麻烦，统一拷成固定 ASCII 名上传
          cp "$EXE" dtw-merchant-setup.exe
          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "极序排队商户端更新",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIG",
                "url": "https://duitaofang.cn/app/dtw-merchant-setup.exe"
              }
            }
          }
          EOF
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SCP="scp -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
          $SCP dtw-merchant-setup.exe latest.json admin@39.104.176.218:/var/www/app/
          echo "已发布 v$VERSION 到 https://duitaofang.cn/app/"

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install deps
        run: npm install

      - name: Generate app icons
        run: npx tauri icon app-icon.png

      - name: Build (universal .dmg)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v4
        with:
          name: dtw-merchant-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
